[project]
name = "random-katakana"
version = "0.1.0"
description = ""
authors = [
    {name = "Niklas Schubert",email = "niklas.schubert@thinktecture.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests (>=2.32.5,<3.0.0)",
    "lxml (>=6.0.2,<7.0.0)",
    "pyaudio (>=0.2.14,<0.3.0)",
    "auroraapi (>=0.2.0,<0.3.0)",
    "openai (>=2.8.1,<3.0.0)",
]

[tool.poetry]
packages = [{include = "random_katakana", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "lxml-stubs (>=0.5.1,<0.6.0)"
]
